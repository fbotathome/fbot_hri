doorbell_detector_node:
  ros__parameters:
    fbot_doorbell_detection:
      sample_paths: # Absolute paths to the reference doorbell .wav samples; any of them triggers a detection
        - "/home/fbot/fbot_ws/src/fbot_hri/fbot_speech/resources/doorbell_dingdong.wav"
        - "/home/fbot/fbot_ws/src/fbot_hri/fbot_speech/resources/doorbell_buzzer.wav"
      sample_rate: 16000
      n_mfcc: 20
      threshold: 0.70 # Cosine similarity threshold within [0, 1]
      cooldown: 20 # Listening loops to skip after a detection
    publishers:
      fbot_doorbell_detection:
        topic: "/fbot_speech/doorbell/detected"
